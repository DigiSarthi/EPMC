<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSEPD MBPY CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#0b2545;--navy2:#133a68;--blue:#2563eb;--bg:#f0f4f8;--surf:#fff;--bd:#cbd5e1;--tx:#0f172a;--mut:#64748b;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#c2410c;--warnbg:#ffedd5;--info:#0369a1;--infobg:#e0f2fe}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);height:100vh;display:flex;overflow:hidden}
aside{width:250px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:.2s}
.brand{padding:18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand h2{font-size:16px}.brand span{font-size:11px;color:#94a3b8;text-transform:uppercase;display:block;margin-top:4px}
nav{flex:1;overflow-y:auto;padding:10px 0}
.ni{padding:12px 20px;color:#cbd5e1;font-size:14px;font-weight:500;cursor:pointer;border-left:4px solid transparent}
.ni:hover,.ni.on{background:var(--navy2);color:#fff;border-left-color:#38bdf8}
main{flex:1;display:flex;flex-direction:column;min-width:0;overflow-y:auto}
header{background:var(--surf);padding:12px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;gap:10px}
header h1{font-size:18px;color:var(--navy)}#menu{display:none}
#view{padding:20px}
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy2)}.btn.s{background:#fff;border-color:var(--bd);color:var(--tx)}.btn.d{background:var(--bad)}.btn.g{background:var(--ok)}.btn.sm{padding:4px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surf);padding:14px;border-radius:8px;border:1px solid var(--bd);border-top:4px solid var(--navy)}
.kpi.ok{border-top-color:var(--ok)}.kpi.bad{border-top-color:var(--bad)}.kpi.warn{border-top-color:var(--warn)}.kpi.info{border-top-color:var(--info)}
.kpi b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}.kpi i{display:block;font-style:normal;font-size:26px;font-weight:700;margin-top:4px}
.box{background:var(--surf);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
.fs{padding:12px;background:#f8fafc;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;background:#fff;max-width:100%}
.fs input[type=text]{flex:1;min-width:180px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f5f9;color:var(--navy);text-align:left;padding:9px 11px;white-space:nowrap;border-bottom:1px solid var(--bd)}
td{padding:8px 11px;border-bottom:1px solid #edf2f7}tr:hover td{background:#f8fafc}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap;background:var(--infobg);color:var(--info)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.pg{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000}
.mc{background:#fff;border-radius:8px;width:94%;max-width:920px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{padding:14px 18px;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center}.mh button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.mbd{padding:18px;overflow-y:auto;background:#f8fafc}
.sec{font-size:13px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--bd);padding-bottom:4px;margin:16px 0 10px;text-transform:uppercase}.sec:first-child{margin-top:0}
.gd{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.dc{background:#fff;padding:8px 11px;border-radius:4px;border:1px solid var(--bd)}.dc label{display:block;font-size:11px;color:var(--mut);font-weight:600}.dc div{font-size:13px;font-weight:600;word-break:break-word}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}.fg label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:3px}.fg input,.fg select,.fg textarea{width:100%}
.steps{display:flex;gap:6px;flex-wrap:wrap}.step{flex:1;min-width:120px;padding:8px;border-radius:6px;background:#e2e8f0;font-size:12px;text-align:center}.step.done{background:var(--okbg);color:var(--ok)}.step.cur{background:var(--blue);color:#fff}.step small{display:block;font-size:10px;opacity:.85}
#login{margin:auto;background:#fff;padding:32px;border-radius:10px;width:92%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.15)}#login h2{color:var(--navy);margin-bottom:4px}#login input{width:100%;margin:6px 0}
#toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:6px;color:#fff;background:var(--ok);display:none;z-index:2000;max-width:80vw}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
@media(max-width:800px){aside{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-100%)}aside.open{transform:none}#menu{display:inline-block}#view{padding:12px}}
</style></head><body>
<div id="login"><h2>SSEPD ODISHA</h2><p style="color:var(--mut);font-size:13px;margin-bottom:12px">MBPY Beneficiary CRM — sign in</p>
<input id="em" type="email" placeholder="Email / Username"><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
<button class="btn" style="width:100%;margin-top:8px" onclick="login()">Sign In</button><p id="lerr" style="color:var(--bad);font-size:13px;margin-top:10px"></p></div>
<aside id="side" style="display:none"><div class="brand"><h2>SSEPD ODISHA</h2><span id="who"></span></div><nav id="nav"></nav>
<div style="padding:14px;border-top:1px solid rgba(255,255,255,.1)"><button class="btn s" style="width:100%" onclick="sb.auth.signOut().then(()=>location.reload())">Sign Out</button></div></aside>
<main id="mainw" style="display:none"><header><div><button class="btn s" id="menu" onclick="$('side').classList.toggle('open')">☰</button> <h1 id="ttl" style="display:inline"></h1></div><div id="hact"></div></header><div id="view"></div></main>
<div class="mb" id="m1"><div class="mc"><div class="mh"><h3 id="m1t"></h3><button onclick="closeM('m1')">✕</button></div><div class="mbd" id="m1b"></div></div></div>
<div class="mb" id="m2" style="z-index:1100"><div class="mc" style="max-width:520px"><div class="mh"><h3 id="m2t"></h3><button onclick="closeM('m2')">✕</button></div><div class="mbd" id="m2b"></div></div></div>
<div id="toast"></div>
<script>
/* ====== CONFIG: paste your Supabase project URL + ANON (public) key. NEVER put the service-role key here. ====== */
const SUPABASE_URL='https://mhxjeqjhsljcwqgbjdkp.supabase.co', SUPABASE_ANON_KEY='sb_publishable_0eYXblqghfQ9mCvi7Kd6lA_1UofbQJE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';
const STAGES=['call_pending','call_connected','lead_generated','documents_received','payment_received','completed'];
const SL={call_pending:'Call Pending',call_connected:'Call Connected',lead_generated:'Lead Generated',documents_received:'Documents Received',payment_received:'Payment Received',completed:'Completed'};
const TS={call_pending:'created_at',call_connected:'connected_at',lead_generated:'lead_generated_at',documents_received:'documents_at',payment_received:'payment_at',completed:'completed_at'};
const OUT=['Connected','Not Connected','Busy','Call Back','Wrong Number','Not Interested','Interested','Documents Pending','Payment Pending'];
const FIELDS=['district','application_id','application_number','application_status','rejection_reason','pension_type','photo','applicant_name','father_spouse_name','dob','age','gender','aadhaar_number','mobile_no','social_category','sub_division','address_type','block','gp','village','habitation','pin','account_holder_name','account_number','ifsc_code','branch_name'];
const SENS=['aadhaar_number','account_holder_name','account_number','ifsc_code','branch_name'];
const BCOLS=FIELDS.filter(f=>!SENS.includes(f)&&f!=='photo').join(',')+',apply_date';
let me=null,cur='dash',PG=1,LIM=25,PAYCFG={};
const isA=()=>me&&me.role==='admin';
function toast(m,bad){const t=$('toast');t.textContent=m;t.style.background=bad?'var(--bad)':'var(--ok)';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function run(p){const{data,error}=await p;if(error){toast(error.message,1);throw error}return data}
async function all(build){let o=[],i=0;for(;;){const d=await run(build().range(i,i+999));o=o.concat(d);if(d.length<1000)return o;i+=1000}}
const openM=(id,t,h)=>{$(id+'t').textContent=t;$(id+'b').innerHTML=h;$(id).style.display='flex'};const closeM=id=>$(id).style.display='none';
const bdg=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const stBadge=s=>bdg(SL[s]||s,s==='completed'||s==='payment_received'?'ok':s==='call_pending'?'warn':'');
const opts=(a,sel,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const uniq=(a,k)=>[...new Set(a.map(x=>x[k]).filter(Boolean))].sort();
const dl=(name,text,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()};
function csv(rows,cols){return[cols.join(','),...rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n')}

/* ---------- auth ---------- */
async function login(){$('lerr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)return $('lerr').textContent=error.message;boot()}
async function boot(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(!p||!p.is_active){await sb.auth.signOut();$('lerr').textContent='Account inactive or not found. Contact admin.';return}
 me=p;PAYCFG=(await sb.from('settings').select('value').eq('key','payment_config').maybeSingle()).data?.value||{};$('login').style.display='none';$('side').style.display='flex';$('mainw').style.display='flex';
 $('who').textContent=`${p.full_name||p.email} · ${p.role}`;
 const nav=isA()?[['dash','📊 Admin Dashboard'],['ben','👥 Beneficiary Master'],['leads','🎯 Lead Assignment'],['dup','♻️ Duplicates'],['emp','🧑‍💼 Employees'],['fu','⏰ Follow-ups'],['calls','📞 Call History'],['pay','💰 Payments'],['trf','🔁 Transfer History'],['imp','📥 Import / Export'],['aud','🧾 Audit Log'],['set','⚙️ Settings']]
  :[['dash','📊 My Dashboard'],['fu','⏰ My Follow-ups'],['calls','📞 My Call History']];
 $('nav').innerHTML=nav.map(([k,l])=>`<div class="ni" data-k="${k}" onclick="go('${k}')">${l}</div>`).join('');go('dash');
}
function go(k){cur=k;PG=1;document.querySelectorAll('.ni').forEach(e=>e.classList.toggle('on',e.dataset.k===k));$('side').classList.remove('open');$('ttl').textContent=document.querySelector(`.ni[data-k="${k}"]`).textContent.slice(3);$('hact').innerHTML='';
 $('view').innerHTML='<p style="color:var(--mut)">Loading…</p>';(V[(isA()?'a_':'e_')+k]||V[k])()}
const refresh=()=>go(cur);

/* ---------- shared data ---------- */
const leadsQ=()=>sb.from('leads').select(`*,beneficiaries!leads_beneficiary_id_fkey(${BCOLS}),profiles(full_name,employee_code)`).order('created_at').order('id');
const kpi=(l,v,c='')=>`<div class="kpi ${c}"><b>${l}</b><i>${v}</i></div>`;
function table(cols,rows,empty='No records.'){return`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" style="text-align:center;color:var(--mut);padding:24px">${empty}</td></tr>`}</tbody></table></div>`}
function pager(n,fn){const s=(PG-1)*LIM;return`<div class="pg"><span>Showing ${n?s+1:0}–${Math.min(s+LIM,n)} of ${n}</span><span><button class="btn s sm" onclick="PG>1&&(PG--,${fn}())">Prev</button> ${PG} <button class="btn s sm" onclick="PG*LIM<${n}&&(PG++,${fn}())">Next</button></span></div>`}
const slice=a=>a.slice((PG-1)*LIM,PG*LIM);

const fmtD=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB'):'';
const dgrp=(t,ks,x)=>`<div class="sec">${t}</div><div class="gd">${ks.map(k=>`<div class="dc"><label>${k==='apply_date'?'apply date':k.replace(/_/g,' ')}</label><div>${esc(k==='apply_date'?fmtD(x[k]):x[k])||'—'}</div></div>`).join('')}</div>`;
const CR={reapplied_auto:'Already re-applied (auto)',reapplied_told:'Already re-applied (told)',status_changed:'Status no longer rejected',not_interested:'Not interested',wrong_number:'Wrong number'};
const lBadge=l=>l.closed_reason?bdg('Closed: '+CR[l.closed_reason],'bad'):stBadge(l.status);
const cnt=async q=>{const r=await q;return r.error?null:(r.count||0)};
const V={};
/* ====== ADMIN DASHBOARD ====== */
let selEmp=null;
V.a_dash=async function(){
 const f=$('d-from')?.value||null,t=$('d-to')?.value||null;
 const s=await run(sb.rpc('admin_summary',{p_from:f,p_to:t}));const[un,clc]=await Promise.all([cnt(sb.from('leads').select('id',{count:'exact',head:true}).is('assigned_to',null).is('closed_reason',null)),cnt(sb.from('leads').select('id',{count:'exact',head:true}).not('closed_reason','is',null))]);const E=s.by_emp,sum=k=>E.reduce((a,e)=>a+e[k],0);
 $('view').innerHTML=`<div class="fs box" style="border-radius:8px"><label>From <input type="date" id="d-from" value="${f||''}"></label><label>To <input type="date" id="d-to" value="${t||''}"></label><button class="btn" onclick="V.a_dash()">Apply</button><button class="btn s" onclick="$('d-from').value=$('d-to').value='';V.a_dash()">Reset</button></div>
 <div class="kpis">${kpi('Total Beneficiaries',s.beneficiaries)}${kpi('Rejected Applications',s.rejected,'bad')}${kpi('Assigned Leads',s.assigned,'info')}${kpi('Unassigned Leads',un??s.unassigned,'warn')}${kpi('Closed / Re-applied',clc??0,'bad')}${kpi('Employees',s.employees)}${kpi('Total Calls',sum('calls'))}${kpi('Connected Calls',sum('connected'),'ok')}${kpi('Leads Generated',sum('leads'))}${kpi('Documents Received',sum('docs'))}${kpi('Payments Received',sum('payments'),'ok')}${kpi('Completed Leads',sum('completed'),'ok')}</div>
 <div class="box"><div class="sec" style="margin:0;padding:12px">Employee Performance (click a name for details)</div>${table(['Employee','Assigned','Calls','Connected','Leads','Documents','Payments','Completed'],E.map(e=>[`<a href="#" onclick="empDetail('${e.id}');return false" style="color:var(--blue);font-weight:600">${esc(e.full_name)}</a> <small>${esc(e.employee_code||'')}</small>`,e.assigned,e.calls,e.connected,e.leads,e.docs,e.payments,e.completed]))}</div>`;
};
async function empDetail(id){const L=await all(()=>leadsQ().eq('assigned_to',id));const e=L[0]?.profiles;
 openM('m1','Employee leads',table(['Application','Applicant','Status','Assigned'],L.map(l=>[esc(l.beneficiaries.application_id),esc(l.beneficiaries.applicant_name),lBadge(l),fmt(l.assigned_at)]),'No leads assigned.'))}

/* ====== BENEFICIARY MASTER ====== */
let BCNT=0,BOPT=null,BT=null,BSEQ=0;
const BFLT=[['b-d','district'],['b-b','block'],['b-g','gp'],['b-v','village'],['b-s','application_status'],['b-r','rejection_reason'],['b-p','pension_type']];
function benQ(sel,cnt){const g=i=>$(i)?.value||'';let q=sb.from('beneficiaries').select(sel,cnt?{count:'exact'}:undefined);
 BFLT.forEach(([id,k])=>{if(g(id))q=q.eq(k,g(id))});
 const t=g('b-q').trim().replace(/[,()%*\\]/g,' ').trim();
 if(t)q=q.or(['application_id','application_number','applicant_name','father_spouse_name','mobile_no','village','gp'].map(c=>`${c}.ilike.%${t}%`).join(','));
 return q.order('application_id')}
async function benOptions(){
 try{const r=await sb.rpc('rpc_ben_filters');if(!r.error&&r.data)return r.data}catch(e){}
 // fallback if patch5.sql was not run: read only the 7 filter columns, all pages in parallel
 const cols=BFLT.map(x=>x[1]).join(',');const c=await sb.from('beneficiaries').select('id',{count:'exact',head:true});const n=c.count||0;
 const pages=await Promise.all(Array.from({length:Math.ceil(n/1000)},(_,k)=>sb.from('beneficiaries').select(cols).order('id').range(k*1000,k*1000+999)));
 const rows=pages.flatMap(p=>p.data||[]);const o={};BFLT.forEach(([,k])=>o[k]=uniq(rows,k));return o}
V.a_ben=async function(){
 if(!BOPT)BOPT=await benOptions();
 const sel=(id,k,l)=>`<select id="${id}" onchange="PG=1;benF()">${opts(BOPT[k]||[],'',l)}</select>`;
 $('view').innerHTML=`<div class="box"><div class="fs"><input type="text" id="b-q" placeholder="Search ID, name, mobile, village…" oninput="PG=1;clearTimeout(BT);BT=setTimeout(benF,350)">${sel('b-d','district','All Districts')}${sel('b-b','block','All Blocks')}${sel('b-g','gp','All GPs')}${sel('b-v','village','All Villages')}${sel('b-s','application_status','All Statuses')}${sel('b-r','rejection_reason','All Reasons')}${sel('b-p','pension_type','All Pension Types')}<button class="btn s" onclick="benCSV()">Export Filtered CSV</button></div><div id="b-t"></div></div>`;benF()};
async function benCSV(){toast('Preparing export…');const R=await all(()=>benQ(BCOLS+',id',false));dl('filtered_beneficiaries.csv',csv(R,FIELDS.filter(f=>!SENS.includes(f)&&f!=='photo')),'text/csv')}
async function benF(){const t=$('b-t');if(!t)return;const my=++BSEQ;t.style.opacity=.5;
 let res;try{res=await benQ(BCOLS+',id',true).range((PG-1)*LIM,PG*LIM-1)}catch(e){res={error:e}}
 if(my!==BSEQ)return;t.style.opacity=1;const {data,count,error}=res;
 if(error){t.innerHTML=`<div class="card" style="color:var(--bad)">Could not load: ${esc(error.message||String(error))}</div>`;return}
 BCNT=count||0;
 t.innerHTML=table(['Application ID','Applicant','Father/Spouse','District / Block','Pension','Age/Sex','Status','Mobile',''],data.map(r=>[`<b>${esc(r.application_id)}</b>`,esc(r.applicant_name),esc(r.father_spouse_name),esc(r.district)+'<br><small>'+esc(r.block)+'</small>',esc(r.pension_type),esc(r.age)+' / '+esc(r.gender),bdg(r.application_status||'Pending',/reject/i.test(r.application_status)?'bad':/approv/i.test(r.application_status)?'ok':'warn'),esc(r.mobile_no),`<button class="btn s sm" onclick="benView('${r.id}')">View</button>`]))+pager(BCNT,'benF')}
async function benView(id){const r=await run(sb.from('beneficiaries').select('*,beneficiary_sensitive(*)').eq('id',id).single());const x={...r,...(r.beneficiary_sensitive||{})};
 const grp=(t,ks)=>`<div class="sec">${t}</div><div class="gd">${ks.map(k=>`<div class="dc"><label>${k.replace(/_/g,' ')}</label><div>${esc(x[k])||'—'}</div></div>`).join('')}</div>`;
 openM('m1',`${x.applicant_name||''} [${x.application_id}]`,(x.photo?`<img src="${esc(x.photo)}" style="width:90px;height:108px;object-fit:cover;border-radius:4px;float:right">`:'')+grp('Application',['district','application_id','application_number','application_status','pension_type','rejection_reason'])+grp('Personal',['applicant_name','father_spouse_name','dob','age','gender','aadhaar_number','mobile_no','social_category'])+grp('Address',['sub_division','address_type','block','gp','village','habitation','pin'])+grp('Bank',['account_holder_name','account_number','ifsc_code','branch_name'])+`<p style="margin-top:12px"><button class="btn s" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(JSON.stringify(x)))}).then(()=>toast('Copied'))">Copy Full Details</button></p>`)}

/* ====== LEAD ASSIGNMENT / TRANSFER (admin) ====== */
let LD=[],LF=[],EMPS=[];
V.a_dup=async function(){$('hact').innerHTML='<button class="btn s" onclick="recheck()">🔄 Re-check</button> <button class="btn s" onclick="dupCSV()">⬇ Export CSV</button>';
 const D=await run(sb.rpc('rpc_duplicates'));

/* ====== PAYMENT QR (UPI) ====== */
const enc=encodeURIComponent;
const upiUri=a=>`upi://pay?pa=${enc(PAYCFG.upi_id)}&pn=${enc(PAYCFG.payee_name||'SSEPD MBPY')}&am=${parseFloat(a)}&cu=INR&tn=${enc('MBPY service fee')}`;
const payLink=a=>{const u=new URL(PAYCFG.pay_base||new URL('pay.html',location.href).href);u.search=`?pa=${enc(PAYCFG.upi_id)}&pn=${enc(PAYCFG.payee_name||'SSEPD MBPY')}&am=${parseFloat(a)}`;return u.href};
let PQ={};
async function payQR(id){
 if(!PAYCFG.upi_id)return toast('UPI ID not set yet. Admin: Settings → Payment (UPI) Settings.',1);
 const l=await run(leadsQ().eq('id',id).single());PQ={name:l.beneficiaries.applicant_name,mob:String(l.beneficiaries.mobile_no||'').replace(/\D/g,'').slice(-10)};
 openM('m2','Send Payment QR',`<div class="fg" style="grid-template-columns:1fr"><div><label>Amount (₹) — change if needed</label><input type="number" id="q-a" value="${esc($('p-a')?.value||PAYCFG.default_amount||'')}" oninput="qrDraw()"></div></div><div id="q-box" style="display:flex;justify-content:center;margin:14px 0"></div><p style="margin-top:10px"><button class="btn g" onclick="qrLinkWA()">Send Payment Link on WhatsApp</button> <button class="btn s" onclick="qrWA()">Send QR Image</button> <button class="btn s" onclick="qrDl()">Download QR</button></p><p style="font-size:12px;color:var(--mut);margin-top:8px">Link: opens the applicant's WhatsApp chat with the payment link. QR Image: phone → pick WhatsApp chat; computer → image is copied, press Ctrl+V in chat.</p><p style="font-size:12px;color:var(--mut);margin-top:10px">After the applicant pays, set Payment Status = Received in the lead, add the transaction reference, and save.</p>`);qrDraw()}
function qrDraw(){const a=parseFloat($('q-a').value),b=$('q-box');b.innerHTML='';if(!(a>0))return;new QRCode(b,{text:upiUri(a),width:210,height:210})}
function qrImage(a){return new Promise(res=>{const src=$('q-box').querySelector('canvas'),W=420,H=480,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#0b2545';x.font='bold 22px sans-serif';x.fillText('SSEPD MBPY Service Payment',W/2,40);
 x.fillStyle='#15803d';x.font='bold 44px sans-serif';x.fillText('₹ '+a,W/2,100);x.imageSmoothingEnabled=false;x.drawImage(src,60,120,300,300);
 x.font='16px sans-serif';x.fillStyle='#475569';x.fillText('Scan with PhonePe / GPay / Paytm',W/2,458);c.toBlob(res,'image/png')})}
const qrAmt=()=>{const a=parseFloat($('q-a').value);if(!(a>0)){toast('Enter a valid amount',1);return null}return a};
async function qrWA(){const a=qrAmt();if(!a)return;const blob=await qrImage(a),file=new File([blob],'payment-qr.png',{type:'image/png'}),cap=`Namaste ${PQ.name}, MBPY service ka ₹${a} ka bhugtan is QR ko scan karke karein.`;
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:cap});return}catch(e){if(e.name==='AbortError')return}}
 if(PQ.mob.length<10)return toast('Applicant mobile number is missing/invalid',1);
 let ok=false;try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);ok=true}catch(e){}
 if(!ok){const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='payment-qr.png';l.click()}
 window.open(`https://wa.me/91${PQ.mob}?text=${enc(cap)}`,'_blank');
 toast(ok?'QR copied. In the WhatsApp chat press Ctrl+V and Send.':'QR downloaded. Attach it in the WhatsApp chat and Send.')}
function qrLinkWA(){const a=qrAmt();if(!a)return;if(PQ.mob.length<10)return toast('Applicant mobile number is missing/invalid',1);
 window.open(`https://wa.me/91${PQ.mob}?text=${enc(`Namaste ${PQ.name}, MBPY service ka ₹${a} ka bhugtan karne ke liye is link ko kholein aur UPI app se pay karein: ${payLink(a)}`)}`,'_blank')}
async function qrDl(){const a=qrAmt();if(!a)return;const l=document.createElement('a');l.href=URL.createObjectURL(await qrImage(a));l.download='payment-qr.png';l.click()}
const _setOld=V.a_set;
V.a_set=async function(){await _setOld();const c=(await run(sb.from('settings').select('value').eq('key','payment_config').maybeSingle()))?.value||{};
 $('view').insertAdjacentHTML('beforeend',`<div class="card"><h3>Payment (UPI) Settings</h3><p style="font-size:13px;color:var(--mut);margin:6px 0 10px">Use the organisation's own UPI ID only. Employees send QR/links made from this.</p><div class="fg"><div><label>UPI ID (e.g. name@sbi)</label><input id="u-id" value="${esc(c.upi_id)}"></div><div><label>Payee name (shown to applicant)</label><input id="u-n" value="${esc(c.payee_name)}"></div><div><label>Default amount (₹)</label><input id="u-a" type="number" value="${esc(c.default_amount)}"></div><div style="grid-column:1/-1"><label>Payment page address (optional, e.g. https://pay.yourdomain.in) — leave blank to use this site</label><input id="u-b" value="${esc(c.pay_base)}"></div></div><p style="margin-top:10px"><button class="btn" onclick="savePayCfg()">Save Payment Settings</button></p></div>`)};
async function savePayCfg(){const v={upi_id:$('u-id').value.trim(),payee_name:$('u-n').value.trim(),default_amount:$('u-a').value.trim(),pay_base:$('u-b').value.trim()};if(v.pay_base&&!/^https:\/\/[^\s]+$/.test(v.pay_base))return toast('Payment page address must start with https://',1);
 if(!/^[\w.\-]{2,}@[\w.\-]{2,}$/.test(v.upi_id))return toast('Enter a valid UPI ID like name@bank',1);if(!v.payee_name)return toast('Enter payee name',1);
 await run(sb.from('settings').upsert({key:'payment_config',value:v}));PAYCFG=v;toast('Payment settings saved')}

/* ====== IMPORT / EXPORT / BACKUP (existing features, now writing to Supabase) ====== */
const cleanKey=k=>String(k||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const RULES={apply_date:['applydate','applicationdate','appliedon','applieddate','dateofapplication','submissiondate','submitteddate','date'],district:['district','dist','districtname'],application_id:['applicationid','appid','id','applicantid'],application_number:['applicationnumber','applicationno','appno','ackno'],application_status:['applicationstatus','status','appstatus','currentstatus'],rejection_reason:['rejectionreason','rejectreason','remarks','reason'],pension_type:['pensiontype','pension','scheme','schemename'],photo:['photo','applicantphoto','image','picture','photourl','pic'],applicant_name:['applicantname','name','beneficiaryname','nameofapplicant'],father_spouse_name:['fatherspousename','fatherhusbandname','fatherorhusbandname','fatherorspousename','fathername','husbandname','spousename','guardianname','guardian','relationname','relativename','father','husband','spouse'],dob:['dob','dateofbirth','birthdate'],age:['age','years'],gender:['gender','sex'],aadhaar_number:['aadhaarnumber','aadhaar','aadhar','aadharno','uid'],mobile_no:['mobileno','mobile','phone','contactno','contact','cellno'],social_category:['socialcategory','caste','category'],sub_division:['subdivision','subdiv'],address_type:['addresstype'],block:['block','blockname','ulb','blockulb'],gp:['gp','grampanchayat','panchayat'],village:['village','villagename'],habitation:['habitation','ward'],pin:['pin','pincode','postalcode'],account_holder_name:['accountholdername','accountholder','holdername'],account_number:['accountnumber','accountno','bankaccno','accno'],ifsc_code:['ifsccode','ifsc'],branch_name:['branchname','branch']};
function cleanPhoto(v){v=String(v||'').trim();if(!v)return'';const m=v.match(/src\s*=\s*["']([^"']+)["']/i);if(m)v=m[1];
 if(!/^(https?:|data:)/i.test(v)&&(/^\.?\//.test(v)||/download|photo/i.test(v)))v='https://ssepd.odisha.gov.in'+(v.startsWith('./')?v.slice(1):v.startsWith('/')?v:'/'+v);return v}
async function extractImages(buf){const map={},ord=[];try{const z=await JSZip.loadAsync(buf);const media=[];z.forEach((q,f)=>{if(q.startsWith('xl/media/')&&!f.dir)media.push(q)});
 media.sort((a,b)=>parseInt(a.match(/\d+/)?.[0]||0)-parseInt(b.match(/\d+/)?.[0]||0));const mime=q=>q.toLowerCase().endsWith('png')?'image/png':'image/jpeg';
 for(const q of media)ord.push(`data:${mime(q)};base64,`+await z.file(q).async('base64'));
 const rf=z.file('xl/drawings/_rels/drawing1.xml.rels'),df=z.file('xl/drawings/drawing1.xml');
 if(rf&&df){const P=new DOMParser(),rd=P.parseFromString(await rf.async('text'),'application/xml'),dd=P.parseFromString(await df.async('text'),'application/xml'),t={};
  for(const r of rd.getElementsByTagName('Relationship')){let g=r.getAttribute('Target');g=g.startsWith('../')?'xl/'+g.slice(3):g.startsWith('xl/')?g:'xl/drawings/'+g;t[r.getAttribute('Id')]=g}
  for(const a of[...dd.getElementsByTagName('xdr:twoCellAnchor'),...dd.getElementsByTagName('xdr:oneCellAnchor')]){const fr=a.getElementsByTagName('xdr:from')[0],bl=a.getElementsByTagName('a:blip')[0];if(!fr||!bl)continue;
   const rw=parseInt(fr.getElementsByTagName('xdr:row')[0].textContent,10),tp=t[bl.getAttribute('r:embed')];if(tp&&z.file(tp))map[rw>0?rw-1:0]=`data:${mime(tp)};base64,`+await z.file(tp).async('base64')}}}catch(e){console.warn(e)}
 return{map,ord}}
function tableRows(html){const t=new DOMParser().parseFromString(html,'text/html').querySelector('table');if(!t)return null;const rs=[...t.querySelectorAll('tr')];if(rs.length<2)return null;
 const h=[...rs[0].querySelectorAll('th,td')].map(c=>c.textContent.trim());
 return rs.slice(1).map(r=>{const cs=[...r.querySelectorAll('td')];if(!cs.length)return null;const o={};h.forEach((k,i)=>{const c=cs[i];if(!c)return;const im=c.querySelector('img');o[k]=im?im.getAttribute('src'):c.textContent.trim()});return o}).filter(Boolean)}
const FUZZ={aadhaar_number:/aadha?a?r|^\s*uid/i,social_category:/social|caste/i};
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function normDate(v){v=String(v||'').trim();if(!v)return'';let y,m,d,x;
 if(x=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)){y=+x[1];m=+x[2];d=+x[3]}
 else if(x=v.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})/)){d=+x[1];m=+x[2];y=+x[3];if(y<100)y+=2000}
 else if(x=v.match(/^(\d{1,2})[\-\/ ]([A-Za-z]{3})[a-z]*[\-\/ ,]*(\d{2,4})/)){d=+x[1];m=MON[x[2].toLowerCase()];y=+x[3];if(y<100)y+=2000}
 else if(/^\d{5}$/.test(v)){const t=new Date(Math.round((+v-25569)*864e5));y=t.getUTCFullYear();m=t.getUTCMonth()+1;d=t.getUTCDate()}
 else return'';
 if(!m||m>12||!d||d>31||y<2000||y>2100)return'';return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function mapRow(raw,idx,img){const out={};for(const[c,m]of Object.entries(RULES)){out[c]='';for(const k of Object.keys(raw)){if(m.includes(cleanKey(k))){out[c]=raw[k]==null?'':String(raw[k]).trim();break}}}
 if(!out.father_spouse_name)for(const k of Object.keys(raw)){if(/father|husband|spouse|guardian/i.test(k)){out.father_spouse_name=String(raw[k]??'').trim();break}}for(const[c,re]of Object.entries(FUZZ)){if(!out[c]){const k=Object.keys(raw).find(k=>re.test(k)&&String(raw[k]??'').trim());if(k)out[c]=String(raw[k]).trim()}}out.sub_division=out.sub_division.replace(/\s*address\s*type\s*$/i,'');out.apply_date=normDate(out.apply_date);out.photo=img?.map?.[idx]||img?.ord?.[idx]||cleanPhoto(out.photo);return out}
V.a_imp=function(){$('view').innerHTML=`<div style="max-width:760px;margin:auto"><div class="card"><h3>Import Excel / CSV</h3><p style="font-size:13px;color:var(--mut);margin:6px 0 10px">Duplicates (same Application ID or Application Number) are skipped automatically. Rejected applications become leads automatically.</p><input type="file" id="f-x" accept=".xlsx,.xls,.csv,.tsv,.html,.htm" onchange="importFile(event)"><h4 style="margin:14px 0 6px;font-size:14px">Or paste a table copied from the portal (photos included):</h4><div id="paste" contenteditable="true" style="min-height:90px;max-height:200px;overflow:auto;border:2px solid var(--bd);border-radius:6px;padding:10px;background:#fff;font-size:13px"></div><p style="margin-top:8px"><button class="btn" onclick="pasteImport()">Import Pasted Table</button></p><p id="i-m" style="margin-top:10px;font-weight:600;font-size:13px"></p></div>
 <div class="card"><h3>Export</h3><p style="margin:8px 0"><button class="btn" onclick="exportAll()">Export All Beneficiaries (CSV)</button></p></div>
 <div class="card"><h3>JSON Backup & Restore</h3><p style="margin:8px 0"><button class="btn s" onclick="exportJSON()">Download JSON Backup</button> <button class="btn s" onclick="$('f-j').click()">Restore JSON</button><input type="file" id="f-j" accept=".json" style="display:none" onchange="importJSON(event)"></p><p style="font-size:12px;color:var(--mut)">Restore only adds missing records (duplicates skipped); it never overwrites or deletes.</p></div></div>`};
async function pushRows(rows,img){const m=$('i-m');let ins=0,dup=0,upd=0;const R=rows.map((r,i)=>mapRow(r,i,img)).filter(r=>r.application_id||r.application_number).map(r=>(r.application_id||(r.application_id=r.application_number),r));const skip=rows.length-R.length;
 const un=rows[0]?Object.keys(rows[0]).filter(k=>!Object.values(RULES).some(a=>a.includes(cleanKey(k)))&&!Object.values(FUZZ).some(re=>re.test(k))):[];
 const B=R.some(r=>(r.photo||'').startsWith('data:'))?20:200;
 for(let i=0;i<R.length;i+=B){m.textContent=`Importing ${Math.min(i+B,R.length)} / ${R.length}…`;const c=R.slice(i,i+B);const r=await run(sb.rpc('rpc_import_beneficiaries',{p_rows:c}));ins+=r.inserted;dup+=r.duplicates_skipped;await run(sb.rpc('rpc_fill_missing',{p_rows:c}));upd+=(await run(sb.rpc('rpc_update_status',{p_rows:c.map(r=>({application_id:r.application_id,application_status:r.application_status,rejection_reason:r.rejection_reason}))})))||0}
 m.textContent='Checking re-applied applicants…';const rc=await run(sb.rpc('rpc_detect_reapplied'))||0;const co=await run(sb.rpc('rpc_carry_over_assignment'))||0;const nd=R.filter(r=>!r.apply_date).length;
 m.innerHTML=`<span style="color:var(--ok)">Done: ${ins} new records, ${dup} already existed (their blank fields/photos were filled), ${skip} rows without ID ignored. Photos found: ${R.filter(r=>r.photo).length}. ${upd} existing record(s) got a new status. ${rc} old lead(s) moved to Duplicates / closed. ${co} new lead(s) handed to the same employee.</span>`+(nd?`<br><span style="color:var(--warn)">${nd} row(s) have no readable Apply Date — re-apply detection will use import order for them.</span>`:'')+(un.length?`<br><span style="color:var(--warn)">Columns not recognised (ignored): ${esc(un.join(', '))}</span>`:'')}
async function importFile(e){const f=e.target.files[0];if(!f)return;$('i-m').textContent='Reading…';const ext=f.name.split('.').pop().toLowerCase();
 if(ext==='html'||ext==='htm'){const r=tableRows(await f.text());return r?pushRows(r,null):toast('No table found in file',1)}
 const buf=await f.arrayBuffer();const img=ext==='xlsx'?await extractImages(buf):null;const wb=XLSX.read(buf,{type:'array',raw:false});
 await pushRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{raw:false,defval:''}),img)}
async function pasteImport(){const r=tableRows($('paste').innerHTML);if(!r)return toast('No table found. Copy the table from the portal and paste it in the box.',1);await pushRows(r,null);$('paste').innerHTML=''}
async function fetchFull(){return(await all(()=>sb.from('beneficiaries').select('*,beneficiary_sensitive(*)').order('application_id'))).map(r=>({...r,...(r.beneficiary_sensitive||{})}))}
async function exportAll(){dl('mbpy_all_beneficiaries.csv',csv(await fetchFull(),FIELDS),'text/csv')}
async function exportJSON(){dl(`MBPY_BACKUP_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(await fetchFull(),null,1),'application/json')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{const a=JSON.parse(ev.target.result);if(!Array.isArray(a))throw 0;await pushRows(a)}catch(x){toast('Invalid backup JSON',1)}};r.readAsText(f)}

boot();
